name: Publish to NuGet.org

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual release'
        required: false
        type: string

permissions:
  id-token: write
  contents: write

jobs:
  build-and-pack:
    name: Build, Test & Pack
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gitversion.outputs.nuGetVersionV2 }}
      prerelease: ${{ steps.gitversion.outputs.preReleaseTag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.1.1
        with:
          versionSpec: '5.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3.1.1

      - name: Display Version Info
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "NuGetVersionV2: ${{ steps.gitversion.outputs.nuGetVersionV2 }}"
          echo "PreReleaseTag: ${{ steps.gitversion.outputs.preReleaseTag }}"
          echo "Is PreRelease: ${{ steps.gitversion.outputs.preReleaseTag != '' }}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Test projects exercise the alpha-only fluent API, which is public only with FLUENT_ALPHA.
      # Stable branches (master) get no prerelease tag from GitVersion, so force it for tests.
      - name: Build (Debug for tests)
        run: dotnet build --configuration Debug --no-restore -p:FluentAlpha=true

      - name: Test (Debug)
        run: dotnet test --configuration Debug --no-build

      # Package build: SDK project only and WITHOUT FluentAlpha, so stable packages keep the
      # fluent API internal (GitVersion still enables it for prerelease versions).
      - name: Build (Release for package)
        run: dotnet build src/AspNetCore.Simple.MsTest.Sdk/AspNetCore.Simple.MsTest.Sdk.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack src/AspNetCore.Simple.MsTest.Sdk/AspNetCore.Simple.MsTest.Sdk.csproj --configuration Release --no-build --output ./nupkgs

      - name: Upload NuGet Package as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./nupkgs/*.nupkg
          retention-days: 30
          if-no-files-found: error

      - name: Build Summary
        run: |
          echo "## 📦 Package Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.gitversion.outputs.nuGetVersionV2 }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Type:** ${{ steps.gitversion.outputs.preReleaseTag != '' && 'Preview (Alpha)' || 'Stable Release' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Package ready for deployment approval" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to NuGet.org
    runs-on: ubuntu-latest
    needs: build-and-pack
    environment:
      name: production
      url: https://www.nuget.org/packages/AspNetCore.Simple.MsTest.Sdk/${{ needs.build-and-pack.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download NuGet Package
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: ./nupkgs

      - name: Push to NuGet.org
        run: dotnet nuget push ./nupkgs/*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create Git Tag (stable releases only)
        if: needs.build-and-pack.outputs.prerelease == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ needs.build-and-pack.outputs.version }}"
          git push origin "v${{ needs.build-and-pack.outputs.version }}"

      - name: Create GitHub Release
        uses: actions/create-release@v1
        if: needs.build-and-pack.outputs.prerelease == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.build-and-pack.outputs.version }}
          release_name: Release ${{ needs.build-and-pack.outputs.version }}
          body: |
            ## Release ${{ needs.build-and-pack.outputs.version }}

            Published from branch: ${{ github.ref_name }}
            Reason: ${{ github.event.inputs.reason || 'Manual release' }}

            ### NuGet Package
            https://www.nuget.org/packages/AspNetCore.Simple.MsTest.Sdk/${{ needs.build-and-pack.outputs.version }}
          draft: false
          prerelease: false

      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.build-and-pack.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Type:** ${{ needs.build-and-pack.outputs.prerelease != '' && 'Preview (Alpha)' || 'Stable Release' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 NuGet Package" >> $GITHUB_STEP_SUMMARY
          echo "https://www.nuget.org/packages/AspNetCore.Simple.MsTest.Sdk/${{ needs.build-and-pack.outputs.version }}" >> $GITHUB_STEP_SUMMARY
