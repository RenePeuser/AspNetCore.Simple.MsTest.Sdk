name: Build

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Test projects exercise the alpha-only fluent API, which is public only with FLUENT_ALPHA.
      # Stable branches (master) get no prerelease tag from GitVersion, so force it for tests.
      - name: Build (Debug)
        run: dotnet build --configuration Debug --no-restore -p:FluentAlpha=true

      - name: Test (Debug)
        run: dotnet test --configuration Debug --no-build

      # Release mirrors the package build: SDK project only, FLUENT_ALPHA decided by GitVersion.
      - name: Build (Release)
        run: dotnet build src/AspNetCore.Simple.MsTest.Sdk/AspNetCore.Simple.MsTest.Sdk.csproj --configuration Release --no-restore

      - name: Vulnerability check
        run: dotnet list package --include-transitive --vulnerable
